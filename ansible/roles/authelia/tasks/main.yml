---
# EXPERIMENTAL - Authelia identity provider (OIDC) + forward-auth.
# Only runs when enable_authelia is true. See EXPERIMENTAL-SSO-SMTP.md.

# Validate the user list up front: Authelia refuses to boot if any user is
# missing a required field, and because generate_systemd new:true uses
# `podman run --rm` the failing container is removed before you can read its
# logs. Fail here with a clear message instead.
- name: Assert every authelia_users entry is complete
  ansible.builtin.assert:
    that:
      - item.username | default('') | length > 0
      - item.email | default('') | length > 0
      - item.password_hash | default('') | length > 0
      - item.password_hash | default('') is match('^\$argon2')
    fail_msg: >-
      authelia_users entry {{ item.username | default('(no username)') }} is
      incomplete: username, email and an argon2 password_hash are all required.
      Generate the hash with:
      podman run --rm {{ authelia_image }} authelia crypto hash generate argon2 --password 'THEIRPASS'
    quiet: true
  loop: "{{ authelia_users | default([]) }}"
  loop_control:
    label: "{{ item.username | default('(no username)') }}"
  no_log: true        # entries carry password hashes

- name: Stop authelia if already running
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-authelia.service
    state: stopped
  failed_when: false

- name: Create authelia config directory
  become: true
  ansible.builtin.file:
    path: /etc/authelia
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0700"

- name: Deploy authelia configuration
  become: true
  no_log: true        # contains the OIDC issuer private key and client secret hashes
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: /etc/authelia/configuration.yml
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"

- name: Deploy authelia users database
  become: true
  no_log: true        # contains password hashes
  ansible.builtin.template:
    src: users_database.yml.j2
    dest: /etc/authelia/users_database.yml
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"

- name: Run authelia
  become: true
  become_user: "{{ containers_user }}"
  no_log: true        # secrets are injected as env vars below
  containers.podman.podman_container:
    name: authelia
    image: "{{ authelia_image }}"
    state: present
    network:
      - edge
    volume:
      - /etc/authelia:/config:Z
    # Built as a dict so the SMTP password env var is only present when SMTP is
    # enabled. Authelia treats the mere presence of AUTHELIA_NOTIFIER_SMTP_*
    # (even empty) as "smtp notifier configured", which then fatally collides
    # with the filesystem notifier the template renders when SMTP is off.
    env: >-
      {{
        {
          'AUTHELIA_SESSION_SECRET': vault_authelia_session_secret,
          'AUTHELIA_STORAGE_ENCRYPTION_KEY': vault_authelia_storage_encryption_key,
          'AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET': vault_authelia_jwt_secret,
          'AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET': vault_authelia_oidc_hmac_secret
        } | combine(
          {'AUTHELIA_NOTIFIER_SMTP_PASSWORD': vault_smtp_password | default('')}
          if (enable_smtp | default(false)) else {}
        )
      }}
    label:
      io.containers.autoupdate: "registry"
      traefik.enable: "true"
      # Portal + OIDC endpoints served under /auth (no prefix stripping -
      # Authelia knows it lives under /auth via server.address in its config).
      traefik.http.routers.authelia.entrypoints: "websecure"
      traefik.http.routers.authelia.rule: "Host(`{{ domain }}`) && PathPrefix(`{{ authelia_subpath }}`)"
      traefik.http.routers.authelia.tls: "true"
      traefik.http.routers.authelia.tls.certresolver: "letsencrypt"
      traefik.http.routers.authelia.service: "authelia"
      traefik.http.services.authelia.loadbalancer.server.port: "9091"
      # Forward-auth middleware other routers can attach to protect bare paths
      # (apps without their own login). Not applied to anything by default.
      traefik.http.middlewares.authelia.forwardauth.address: "http://authelia:9091{{ authelia_subpath }}/api/authz/forward-auth"
      traefik.http.middlewares.authelia.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authelia.forwardauth.authResponseHeaders: "Remote-User,Remote-Groups,Remote-Name,Remote-Email"
    generate_systemd:
      path: "/home/{{ containers_user }}/.config/systemd/user/"
      restart_policy: on-failure
      names: true
      new: true

- name: Add boot-ordering dependency on traefik to authelia unit (no cascade stop)
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ containers_user }}/.config/systemd/user/container-authelia.service"
    regexp: "^{{ item.key }}=container-traefik\\.service"
    line: "{{ item.key }}=container-traefik.service"
    insertbefore: "^\\[Service\\]"
    state: present
  loop:
    - {key: Wants}
    - {key: After}

- name: Start authelia
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-authelia.service
    enabled: true
    state: started
    daemon_reload: true

# Authelia was just (re)created, so it has a fresh container IP. Traefik only
# learns the new backend when it re-queries, so until it does, /auth returns
# 502 Bad Gateway. The Forgejo role's OIDC step fetches the Authelia discovery
# URL through Traefik during this same run, so refresh Traefik now rather than
# waiting for the end-of-play restart (which the OIDC step would race ahead of).
- name: Restart traefik so it picks up the new authelia backend
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-traefik.service
    state: restarted
  failed_when: false
