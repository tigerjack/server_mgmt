---
- name: Stop collabora if already running
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-collabora.service
    state: stopped
  failed_when: false

- name: Run Collabora Online (CODE) for Nextcloud Office
  become: true
  become_user: "{{ containers_user }}"
  no_log: true
  containers.podman.podman_container:
    name: collabora
    image: "{{ collabora_image }}"
    state: present
    network:
      - edge
    # Same hairpin fix as Forgejo/Nextcloud: the host's /etc/hosts maps the
    # FQDN to 127.0.1.1, which Podman copies into the container. Collabora's
    # WOPI callbacks (CheckFileInfo, file fetch/save) dial the public domain,
    # hit loopback, and fail with "returned 0 (Unknown)" — surfacing in the
    # browser as "Unauthorised WOPI host". Map the domain to the real host IP
    # so callbacks reach Traefik's published 443.
    etc_hosts: "{{ {domain: ansible_facts['default_ipv4']['address']} }}"
    env:
      domain: "{{ domain | replace('.', '\\.') }}"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=false"
      username: "{{ vault_collabora_admin_user }}"
      password: "{{ vault_collabora_admin_password }}"
    label:
      io.containers.autoupdate: "registry"
      traefik.enable: "true"
      traefik.http.routers.collabora-cool.entrypoints: "websecure"
      traefik.http.routers.collabora-cool.rule: "Host(`{{ domain }}`) && PathPrefix(`/cool`)"
      traefik.http.routers.collabora-cool.tls: "true"
      traefik.http.routers.collabora-cool.tls.certresolver: "letsencrypt"
      traefik.http.routers.collabora-cool.service: "collabora-svc"
      traefik.http.routers.collabora-browser.entrypoints: "websecure"
      traefik.http.routers.collabora-browser.rule: "Host(`{{ domain }}`) && PathPrefix(`/browser`)"
      traefik.http.routers.collabora-browser.tls: "true"
      traefik.http.routers.collabora-browser.tls.certresolver: "letsencrypt"
      traefik.http.routers.collabora-browser.service: "collabora-svc"
      # Admin console — higher priority so this rule wins over the broad /browser
      # match above. Requires an Authelia session; WOPI/document endpoints are
      # unaffected because they live under /cool and /hosting, not /browser/dist/admin.
      traefik.http.routers.collabora-admin.entrypoints: "websecure"
      traefik.http.routers.collabora-admin.rule: "Host(`{{ domain }}`) && PathPrefix(`/browser/dist/admin`)"
      traefik.http.routers.collabora-admin.priority: "10"
      traefik.http.routers.collabora-admin.tls: "true"
      traefik.http.routers.collabora-admin.tls.certresolver: "letsencrypt"
      traefik.http.routers.collabora-admin.service: "collabora-svc"
      traefik.http.routers.collabora-admin.middlewares: "authelia@docker"
      traefik.http.routers.collabora-hosting.entrypoints: "websecure"
      traefik.http.routers.collabora-hosting.rule: "Host(`{{ domain }}`) && PathPrefix(`/hosting`)"
      traefik.http.routers.collabora-hosting.tls: "true"
      traefik.http.routers.collabora-hosting.tls.certresolver: "letsencrypt"
      traefik.http.routers.collabora-hosting.service: "collabora-svc"
      traefik.http.services.collabora-svc.loadbalancer.server.port: "9980"
    generate_systemd:
      path: "/home/{{ containers_user }}/.config/systemd/user/"
      restart_policy: on-failure
      names: true
      new: true

- name: Add boot-ordering dependency on traefik to collabora unit (no cascade stop)
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ containers_user }}/.config/systemd/user/container-collabora.service"
    regexp: "^{{ item.key }}=container-traefik\\.service"
    line: "{{ item.key }}=container-traefik.service"
    insertbefore: "^\\[Service\\]"
    state: present
  loop:
    - {key: Wants}
    - {key: After}

- name: Start Collabora
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-collabora.service
    enabled: true
    state: started
    daemon_reload: true
