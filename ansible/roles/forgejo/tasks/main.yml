---
- name: Stop forgejo containers
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: "container-{{ item }}.service"
    state: stopped
  loop:
    - forgejo
    - db_forgejo
  failed_when: false

- name: Create podman volumes for forgejo
  become: true
  become_user: "{{ containers_user }}"
  containers.podman.podman_volume:
    name: "{{ item }}"
    state: present
  loop:
    - forgejo-data
    - forgejo-db

- name: Create forgejo's internal db network
  become: true
  become_user: "{{ containers_user }}"
  containers.podman.podman_network:
    name: mariadb-forgejo
    state: present

- name: Run forgejo's mariadb
  become: true
  become_user: "{{ containers_user }}"
  no_log: true
  containers.podman.podman_container:
    name: db_forgejo
    image: "{{ forgejo_db_image }}"
    state: present
    command:
      - "--transaction-isolation=READ-COMMITTED"
      - "--binlog-format=ROW"
    volume:
      - forgejo-db:/var/lib/mysql
    network:
      - mariadb-forgejo
    env:
      MARIADB_ROOT_PASSWORD: "{{ vault_forgejo_db_root_password }}"
      MARIADB_DATABASE: "{{ vault_forgejo_db_database }}"
      MARIADB_USER: "{{ vault_forgejo_db_user }}"
      MARIADB_PASSWORD: "{{ vault_forgejo_db_password }}"
      MARIADB_AUTO_UPGRADE: "true"
    label:
      io.containers.autoupdate: "registry"
    generate_systemd:
      path: "/home/{{ containers_user }}/.config/systemd/user/"
      restart_policy: on-failure
      names: true
      new: true

# Kept as a separate mariadb instance rather than a second database on
# nextcloud's, by design: a touch heavier on RAM, but it means you can
# restart or upgrade either app's database independently, and a problem
# with one project's data can't take the other project down with it.
# If resources are tight, sharing one mariadb engine with a second
# database/user is a reasonable alternative - just swap db_forgejo's
# network/host for mariadb-nextcloud/db_nextcloud and drop this container.
- name: Run forgejo
  become: true
  become_user: "{{ containers_user }}"
  no_log: true
  containers.podman.podman_container:
    name: forgejo
    image: "{{ forgejo_image }}"
    state: present
    # The standard forgejo image (not the -rootless variant) keeps ALL of its
    # persistent state under /data: repositories at /data/git/repositories,
    # avatars at /data/gitea/avatars, and app.ini at /data/gitea/conf/app.ini.
    # This MUST be a named volume mounted at /data - if it isn't, the image's
    # `VOLUME /data` makes podman create a throwaway anonymous volume, and with
    # generate_systemd new:true every deploy runs `podman run --rm`, wiping it
    # (repos become unreadable, avatars vanish). /var/lib/gitea and /etc/gitea
    # are the -rootless image's paths and are unused here.
    volume:
      - forgejo-data:/data
    network:
      - edge
      - mariadb-forgejo
    # The host's /etc/hostname maps the FQDN to 127.0.1.1, which Podman copies
    # into the container's /etc/hosts. Without this override, back-channel OIDC
    # calls (discovery fetch, token exchange) dial 127.0.1.1:443 and get
    # "connection refused". Podman *prepends* --add-host entries, so this one
    # wins over the copied 127.0.1.1 line and the domain resolves to the real
    # host IP, where Traefik's published 443 serves a valid cert.
    # NOTE: build the dict via a single Jinja expression so the *key* (domain)
    # is templated - "{{ domain }}": ... leaves the key literal.
    etc_hosts: "{{ {domain: ansible_facts['default_ipv4']['address']} }}"
    label:
      io.containers.autoupdate: "registry"
      traefik.enable: "true"
      traefik.http.routers.forgejo.entrypoints: "websecure"
      traefik.http.routers.forgejo.rule: "Host(`{{ domain }}`) && PathPrefix(`/git`)"
      traefik.http.routers.forgejo.tls: "true"
      traefik.http.routers.forgejo.tls.certresolver: "letsencrypt"
      traefik.http.routers.forgejo.middlewares: "forgejo-strip"
      traefik.http.middlewares.forgejo-strip.stripprefix.prefixes: "/git"
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"
      # Plain TCP passthrough for git-over-ssh on the dedicated gitssh
      # entrypoint (:2222) defined in the traefik role. HostSNI(`*`) is
      # the required catch-all rule for non-TLS TCP routing in traefik -
      # there's no real SNI to match against on a plain SSH connection.
      traefik.tcp.routers.forgejo-ssh.rule: "HostSNI(`*`)"
      traefik.tcp.routers.forgejo-ssh.entrypoints: "gitssh"
      traefik.tcp.routers.forgejo-ssh.service: "forgejo-ssh"
      traefik.tcp.services.forgejo-ssh.loadbalancer.server.port: "2222"
    env:
      FORGEJO__database__DB_TYPE: "mysql"
      FORGEJO__database__HOST: "db_forgejo:3306"
      FORGEJO__database__NAME: "{{ vault_forgejo_db_database }}"
      FORGEJO__database__USER: "{{ vault_forgejo_db_user }}"
      FORGEJO__database__PASSWD: "{{ vault_forgejo_db_password }}"
      FORGEJO__server__DOMAIN: "{{ domain }}"
      FORGEJO__server__ROOT_URL: "https://{{ domain }}/git/"
      FORGEJO__server__SSH_DOMAIN: "{{ domain }}"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__START_SSH_SERVER: "true"
      # Database is fully configured above, so skip the web installer
      # entirely rather than leaving the instance sitting unconfigured.
      FORGEJO__security__INSTALL_LOCK: "true"
      # Block manual self-signup but allow account creation via OIDC/OAuth2.
      # DISABLE_REGISTRATION alone blocks everything including OIDC logins.
      # ALLOW_ONLY_EXTERNAL_REGISTRATION=true lets OIDC create accounts while
      # keeping the manual registration form disabled.
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      # --- EXPERIMENTAL: outbound email via SMTP relay (enable_smtp) ---
      # default('') keeps these harmless when the vault vars are unset.
      FORGEJO__mailer__ENABLED: "{{ (enable_smtp | default(false)) | string | lower }}"
      FORGEJO__mailer__PROTOCOL: "{{ 'smtp+starttls' if smtp_security == 'starttls' else 'smtps' if smtp_security == 'tls' else 'smtp' }}"
      FORGEJO__mailer__SMTP_ADDR: "{{ smtp_host | default('') }}"
      FORGEJO__mailer__SMTP_PORT: "{{ smtp_port | default('') | string }}"
      FORGEJO__mailer__FROM: "{{ smtp_from | default('') }}"
      FORGEJO__mailer__USER: "{{ vault_smtp_user | default('') }}"
      FORGEJO__mailer__PASSWD: "{{ vault_smtp_password | default('') }}"
    generate_systemd:
      path: "/home/{{ containers_user }}/.config/systemd/user/"
      restart_policy: on-failure
      requires:
        - container-db_forgejo.service
      names: true
      new: true

- name: Add boot-ordering dependency on traefik to forgejo unit (no cascade stop)
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ containers_user }}/.config/systemd/user/container-forgejo.service"
    regexp: "^{{ item.key }}=container-traefik\\.service"
    line: "{{ item.key }}=container-traefik.service"
    insertbefore: "^\\[Service\\]"
    state: present
  loop:
    - {key: Wants}
    - {key: After}

- name: Tune forgejo systemd start/stop timeouts
  become: true
  become_user: "{{ containers_user }}"
  community.general.ini_file:
    path: "/home/{{ containers_user }}/.config/systemd/user/container-{{ item.0 }}.service"
    section: Service
    option: "{{ item.1 }}"
    value: 3600
    mode: "0644"
    state: present
    no_extra_spaces: true
  loop: "{{ ['forgejo', 'db_forgejo'] | product(['TimeoutStartSec', 'TimeoutStopSec']) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"

- name: Start db_forgejo at boot
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-db_forgejo.service
    enabled: true
    state: started
    daemon_reload: true

# MariaDB only sets MARIADB_USER credentials on first init of an empty data
# dir. On subsequent deploys the existing volume keeps the old password,
# causing Access denied when Forgejo tries to connect. This task syncs the
# password unconditionally so it always matches the vault, regardless of
# whether the volume is fresh or pre-existing.
- name: Sync forgejo DB user password with vault (idempotent ALTER USER)
  become: true
  become_user: "{{ containers_user }}"
  no_log: true
  ansible.builtin.command:
    cmd: >
      podman exec db_forgejo
      mariadb -uroot -p{{ vault_forgejo_db_root_password }}
      -e "ALTER USER '{{ vault_forgejo_db_user }}'@'%'
          IDENTIFIED BY '{{ vault_forgejo_db_password }}';
          FLUSH PRIVILEGES;"
  register: forgejo_db_pw_sync
  retries: 10
  delay: 6
  until: forgejo_db_pw_sync.rc == 0
  changed_when: false

- name: Start forgejo at boot
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-forgejo.service
    enabled: true
    state: started
    daemon_reload: true

# Guardrail for the anonymous-volume data-loss bug: forgejo's persistent
# state lives under /data, so that path MUST be backed by the forgejo-data
# named volume. If anything ever regresses the mount (wrong path, image
# variant change), podman silently falls back to a throwaway anonymous
# volume that generate_systemd new:true wipes on every deploy. Assert the
# mount is correct and fail loudly here rather than lose data silently.
- name: Inspect forgejo mounts to verify /data persistence
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.command:
    cmd: >-
      {% raw %}podman inspect forgejo --format '{{ range .Mounts }}{{ .Type }}:{{ .Name }}->{{ .Destination }}{{ println }}{{ end }}'{% endraw %}
  register: forgejo_mounts
  changed_when: false

- name: Assert /data is backed by the forgejo-data named volume
  ansible.builtin.assert:
    that:
      - "'volume:forgejo-data->/data' in forgejo_mounts.stdout"
    fail_msg: >-
      forgejo /data is NOT backed by the forgejo-data named volume - it would
      ride on a throwaway anonymous volume and be wiped on the next deploy
      (repos unreadable, avatars lost). Actual mounts:
      {{ forgejo_mounts.stdout }}
    success_msg: "forgejo /data is correctly backed by the forgejo-data named volume."

- name: Ensure forgejo has an admin account (no-op once it already exists)
  become: true
  become_user: "{{ containers_user }}"
  no_log: true
  # Pass the admin password via env var so it never appears in the process
  # table. 'environment:' injects it into this Ansible task's env only;
  # podman exec --env FORGEJO_ADMIN_PW (name only) forwards it into the
  # container; sh -c expands it inside the exec'd shell.
  environment:
    FORGEJO_ADMIN_PW: "{{ vault_forgejo_admin_password }}"
  ansible.builtin.command:
    cmd: >
      podman exec --env FORGEJO_ADMIN_PW --user git forgejo
      sh -c 'forgejo admin user create
      --username "{{ vault_forgejo_admin_user }}"
      --email "{{ vault_forgejo_admin_email }}"
      --password "$FORGEJO_ADMIN_PW"
      --admin --must-change-password=false'
  register: forgejo_admin_create
  # Retry to give MariaDB time to finish starting up
  retries: 10
  delay: 6
  until: forgejo_admin_create.rc == 0 or 'already exists' in forgejo_admin_create.stderr
  changed_when: "'already exists' not in forgejo_admin_create.stderr"
  failed_when: forgejo_admin_create.rc != 0 and 'already exists' not in forgejo_admin_create.stderr

- name: Regenerate git hooks in all repositories
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.command:
    cmd: podman exec --user git forgejo forgejo admin regenerate hooks
  changed_when: false
  retries: 5
  delay: 6
  register: forgejo_regen_hooks
  until: forgejo_regen_hooks.rc == 0

# --- EXPERIMENTAL: Authelia OIDC login source (enable_authelia) ---
- name: Check whether the Authelia OIDC auth source already exists
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.command:
    cmd: podman exec --user git forgejo forgejo admin auth list
  register: forgejo_auth_list
  changed_when: false
  when: enable_authelia | default(false)

- name: Add Authelia as a Forgejo OIDC login source (first run only)
  become: true
  become_user: "{{ containers_user }}"
  no_log: true
  ansible.builtin.command:
    argv: >-
      {{
        [
          'podman', 'exec', '--user', 'git', 'forgejo',
          'forgejo', 'admin', 'auth', 'add-oauth',
          '--name', 'authelia',
          '--provider', 'openidConnect',
          '--key', 'forgejo',
          '--secret', vault_oidc_forgejo_client_secret,
          '--auto-discover-url', 'https://' ~ domain ~ authelia_subpath ~ '/.well-known/openid-configuration',
          '--scopes', 'openid profile email groups',
          '--group-claim-name', 'groups',
          '--admin-group', forgejo_oidc_admin_group
        ]
        + ([] if (forgejo_oidc_group_team_map | default({}) | length == 0) else
           ['--group-team-map', forgejo_oidc_group_team_map | to_json])
        + ([] if (forgejo_oidc_group_team_map | default({}) | length == 0) else
           (['--group-team-map-removal'] if forgejo_oidc_group_team_map_removal | default(true) else []))
      }}
  changed_when: true
  when:
    - enable_authelia | default(false)
    - "'authelia' not in (forgejo_auth_list.stdout | default(''))"

# On every subsequent run the source already exists, so add-oauth is skipped.
# update-oauth re-applies the group->role mapping so changes to
# forgejo_oidc_admin_group take effect without manually recreating the source.
- name: Find the Authelia auth source ID
  ansible.builtin.set_fact:
    forgejo_authelia_auth_id: "{{ (forgejo_auth_list.stdout | default('') | regex_findall('(?m)^\\s*(\\d+)\\s+authelia\\b') + ['']) | first }}"
  when: enable_authelia | default(false)

- name: Enforce Authelia group → role and team mapping on the Forgejo auth source
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.command:
    argv: >-
      {{
        [
          'podman', 'exec', '--user', 'git', 'forgejo',
          'forgejo', 'admin', 'auth', 'update-oauth',
          '--id', forgejo_authelia_auth_id,
          '--group-claim-name', 'groups',
          '--admin-group', forgejo_oidc_admin_group
        ]
        + ([] if (forgejo_oidc_group_team_map | default({}) | length == 0) else
           ['--group-team-map', forgejo_oidc_group_team_map | to_json])
        + ([] if (forgejo_oidc_group_team_map | default({}) | length == 0) else
           (['--group-team-map-removal'] if forgejo_oidc_group_team_map_removal | default(true) else []))
      }}
  changed_when: false
  when:
    - enable_authelia | default(false)
    - forgejo_authelia_auth_id | default('') | length > 0
