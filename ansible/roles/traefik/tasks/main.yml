---
# Rootless Podman cannot bind privileged ports (<1024) without this.
# Traefik needs 80 and 443 on the host.
- name: Allow rootless containers to bind ports >= 80
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    state: present
    sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
    reload: true

- name: Open firewall ports for Traefik
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"
    - "2222"

- name: Stop traefik if already running
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-traefik.service
    state: stopped
  failed_when: false

- name: Look up the containers user's uid (needed for its rootless podman socket path)
  ansible.builtin.getent:
    database: passwd
    key: "{{ containers_user }}"
  register: containers_passwd

- name: Set containers_uid fact
  ansible.builtin.set_fact:
    containers_uid: "{{ containers_passwd.ansible_facts.getent_passwd[containers_user][1] }}"

- name: Enable the rootless podman API socket for the containers user
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: podman.socket
    enabled: true
    state: started

- name: Enable podman-auto-update timer (picks up patch-level image updates on the pinned tags)
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: podman-auto-update.timer
    enabled: true
    state: started

# When podman-auto-update pulls a new image it RECREATES the container, which
# comes up with a fresh IP on the edge network. Traefik's podman/docker provider
# watches the socket for that event, but the watch can silently drop on the
# rootless socket, leaving Traefik routing to the dead container's old IP -> the
# app 502s until Traefik is restarted. A drop-in adds an ExecStartPost that
# restarts Traefik after every auto-update run, forcing it to re-read endpoints.
- name: Create podman-auto-update systemd drop-in directory
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.file:
    path: "/home/{{ containers_user }}/.config/systemd/user/podman-auto-update.service.d"
    state: directory
    mode: "0755"

- name: Restart traefik after auto-update so it re-reads recreated containers' IPs
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.copy:
    dest: "/home/{{ containers_user }}/.config/systemd/user/podman-auto-update.service.d/restart-traefik.conf"
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      # podman auto-update recreates each updated container with a NEW IP on the
      # edge network. Traefik's provider watches the podman event socket, but that
      # watch can silently drop with the rootless socket, leaving Traefik routing
      # to the dead container's old IP (502 Bad Gateway on the affected app until
      # Traefik is restarted). Restart Traefik right after every auto-update run so
      # it re-reads current endpoints. Harmless if Traefik itself was just updated
      # (it is simply restarted a second time).
      [Service]
      ExecStartPost=/usr/bin/systemctl --user restart container-traefik.service
  register: traefik_autoupdate_dropin

- name: Reload the user systemd manager so the auto-update drop-in takes effect
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: traefik_autoupdate_dropin is changed

- name: Create traefik config/cert directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0700"
  loop:
    - /etc/traefik
    - /etc/traefik/letsencrypt
    - /etc/traefik/conf.d

- name: Deploy traefik static middleware configuration
  become: true
  ansible.builtin.copy:
    src: security-headers.yml
    dest: /etc/traefik/conf.d/security-headers.yml
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"

- name: Pre-create acme.json with the permissions traefik requires (it refuses to start otherwise)
  become: true
  ansible.builtin.file:
    path: /etc/traefik/letsencrypt/acme.json
    state: touch
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"

- name: Create the shared edge network (traefik + every app's front end)
  become: true
  become_user: "{{ containers_user }}"
  containers.podman.podman_network:
    name: edge
    subnet: "{{ edge_network_subnet }}"
    state: present
    recreate: false

- name: Run traefik
  become: true
  become_user: "{{ containers_user }}"
  containers.podman.podman_container:
    name: traefik
    image: "{{ traefik_image }}"
    state: present
    network:
      - edge
    ports:
      - "80:80"
      - "443:443"
      - "2222:2222"
    volume:
      - "/run/user/{{ containers_uid }}/podman/podman.sock:/var/run/docker.sock:Z"
      - "/etc/traefik/letsencrypt:/letsencrypt:Z"
      - "/etc/traefik/conf.d:/conf.d:ro,Z"
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Don't auto-expose every container - only ones carrying traefik.enable=true.
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.gitssh.address=:2222"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email={{ acme_email }}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.directory=/conf.d"
      - "--providers.file.watch=true"
      # Apply security headers to every HTTPS response globally.
      - "--entrypoints.websecure.http.middlewares=security-headers@file"
      - "--api.dashboard=false"
      - "--log.level=INFO"
    label:
      io.containers.autoupdate: "registry"
    generate_systemd:
      path: "/home/{{ containers_user }}/.config/systemd/user/"
      restart_policy: on-failure
      names: true
      new: true

- name: Start traefik at boot
  become: true
  become_user: "{{ containers_user }}"
  ansible.builtin.systemd:
    scope: user
    name: container-traefik.service
    enabled: true
    state: started
    daemon_reload: true
  register: traefik_start
  retries: 5
  delay: 5
  until: traefik_start is success
