---
# Rename this file to match your server's hostname (e.g. myserver.yml),
# then fill in real values.

# How Ansible reaches this host
ansible_host: 203.0.113.10           # IP or resolvable hostname
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/id_ed25519   # your personal key

# Public domain pointing at this server's IP.
# Used by Traefik for TLS (Let's Encrypt) and by every app as its base URL.
domain: "example.com"
