[defaults]
inventory          = host_vars/
roles_path         = roles
collections_paths  = ~/.ansible/collections
interpreter_python = auto_silent
stdout_callback    = yaml
bin_ansible_callbacks = true

[ssh_connection]
pipelining = true
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
