[defaults]
inventory          = inventory.yml
roles_path         = roles
collections_paths  = ~/.ansible/collections
interpreter_python = auto_silent
remote_tmp         = /tmp/.ansible-${USER}
# Avoids setfacl failures when sudo-ing to an unprivileged user (containers).
# Remove this line once the acl package is installed on all target hosts
# (see PODMAN-README.md) - that is the more secure alternative.
allow_world_readable_tmpfiles = false

[ssh_connection]
pipelining = true
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
