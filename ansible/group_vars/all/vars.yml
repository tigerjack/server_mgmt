---
# Privilege escalation - login as your personal user, sudo to root for tasks
# that need it. Run playbooks with --ask-become-pass (or store the password
# in the vault as vault_become_pass and set ansible_become_pass: "{{ vault_become_pass }}").
ansible_become: true
ansible_become_method: sudo

# User that owns all containers. Must already exist on the host with
# lingering enabled - see PODMAN-README.md for setup.
containers_user: containers

# Directory name inside roles/static_site/files/ to deploy as the landing page.
# Override per host in host_vars/<hostname>/vars.yml to give each server its own site.
static_site_dir: "site"

# Subnet for the shared edge network (traefik + app front ends).
# Change if it conflicts with an existing network on your hosts.
edge_network_subnet: "10.89.0.0/24"

# Container images - pinned to major.minor, patched automatically by
# podman-auto-update. Bump major.minor deliberately after reading release notes.
traefik_image:           "docker.io/traefik:3.3"
static_site_image:       "docker.io/nginx:1.27-alpine"
nextcloud_image:         "docker.io/nextcloud:34-apache"
nextcloud_db_image:      "docker.io/mariadb:11.4"
nextcloud_valkey_image:  "docker.io/valkey/valkey:8-alpine"
forgejo_image:           "codeberg.org/forgejo/forgejo:9"
forgejo_db_image:        "docker.io/mariadb:11.4"
collabora_image:         "docker.io/collabora/code:latest"
eurooffice_ds_image:     "ghcr.io/euro-office/documentserver:latest"
authelia_image:          "docker.io/authelia/authelia:4.39"

# ISO 3166-1 alpha-2 region code used to validate phone numbers without a
# country code in Nextcloud profile settings. Change to match your region.
nextcloud_phone_region: "IT"

# ---------------------------------------------------------------------------
# Email (SMTP) + single sign-on (Authelia). Authelia is on by default; SMTP is
# off by default and configured per host. See the Authelia SSO section of
# README.md for the full walkthrough.
# ---------------------------------------------------------------------------
# Global defaults — override any of these per host in host_vars/<host>/vars.yml.
# Host vars take precedence over group vars, so adding e.g. `enable_smtp: true`
# to host_vars/spqr-project/vars.yml enables SMTP only for that instance while
# leaving every other host with SMTP off. Same pattern for smtp_host, etc.
enable_smtp: false
enable_authelia: true

# SMTP relay defaults. Each host that enables SMTP should set smtp_host (and
# optionally the other values) in its own host_vars/<host>/vars.yml along with
# credentials in host_vars/<host>/vault.yml (vault_smtp_user/vault_smtp_password).
smtp_host: ""                 # e.g. "smtp.polimi.it" — set per host
smtp_port: 587
smtp_security: "starttls"     # starttls (587) | tls (465) | none (25)
smtp_from: "noreply@{{ domain }}"

# Authelia is served under this path on the main domain (no subdomain needed).
authelia_subpath: "/auth"

# ---------------------------------------------------------------------------
# OIDC group → role mapping
# ---------------------------------------------------------------------------
# Authelia issues a `groups` claim (the list under each user in authelia_users)
# to Forgejo and Nextcloud. These settings decide how the apps react to it.
#
# Forgejo: members of this Authelia group are made Forgejo admins on login.
forgejo_oidc_admin_group: "admins"
#
# Forgejo group → org-team mapping. Maps an Authelia group to one or more
# Forgejo teams inside one or more orgs. Users are added to (and, by default,
# removed from) teams at each login based on their current group membership.
#
# The value is a nested dict rendered to JSON: { "<group>": { "<org>": ["<team>", ...], ... }, ... }
# An empty dict (the default) means no team mapping is applied.
#
# IMPORTANT: orgs and teams referenced here must already exist in Forgejo —
# the deploy only manages membership, it does not create orgs or teams.
#
# Example (add to host_vars/<host>/vars.yml to override per host):
#   forgejo_oidc_group_team_map:
#     polimi:
#       polimi: [Members]
#     developers:
#       polimi: [Developers]
#
# With this example:
#   - A user in group `polimi`     → added to the `Members`    team of org `polimi`
#   - A user in group `developers` → added to the `Developers` team of org `polimi`
#   - A user in both               → added to both teams
#
# Users removed from a group are also removed from the mapped team on next login
# (controlled by forgejo_oidc_group_team_map_removal, on by default).
forgejo_oidc_group_team_map: {}
forgejo_oidc_group_team_map_removal: true
#
# Nextcloud: when true, Authelia groups are synced into Nextcloud groups on
# login (useful for quotas, group folders, and share policies). Note: this does
# NOT grant Nextcloud admin — admin rights come from the built-in `admin` group,
# which is kept local on purpose. Use the local admin account for that.
nextcloud_oidc_group_provisioning: true
