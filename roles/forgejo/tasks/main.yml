---
# Forgejo role - deploys Forgejo with PostgreSQL via Podman quadlets

- name: Create Forgejo directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ forgejo_base_dir }}"
    - "{{ forgejo_data_dir }}"
    - "{{ forgejo_db_dir }}"

- name: Deploy Forgejo PostgreSQL quadlet container unit
  ansible.builtin.template:
    src: forgejo_db.container.j2
    dest: /etc/containers/systemd/forgejo_db.container
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon-reload
    - Restart forgejo_db

- name: Deploy Forgejo app.ini configuration
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ forgejo_data_dir }}/app.ini"
    owner: root
    group: root
    mode: "0644"
  notify: Restart forgejo

- name: Deploy Forgejo quadlet container unit
  ansible.builtin.template:
    src: forgejo.container.j2
    dest: /etc/containers/systemd/forgejo.container
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon-reload
    - Restart forgejo

- name: Flush handlers to ensure daemon-reload runs before enabling services
  ansible.builtin.meta: flush_handlers

- name: Enable and start Forgejo PostgreSQL service
  ansible.builtin.systemd:
    name: forgejo_db
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for PostgreSQL to be ready
  ansible.builtin.wait_for:
    timeout: 20
  delegate_to: localhost
  become: false

- name: Enable and start Forgejo service
  ansible.builtin.systemd:
    name: forgejo
    enabled: true
    state: started
    daemon_reload: true
