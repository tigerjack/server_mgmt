---
# Common role - base system setup applied to all managed hosts

- name: Gather OS facts
  ansible.builtin.setup:
    gather_subset:
      - distribution
      - os_family

- name: Install common packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install common packages (RHEL/Fedora/Rocky/Alma)
  ansible.builtin.dnf:
    name: "{{ common_packages_rpm | default(common_packages) }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Open required firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ firewall_allowed_ports }}"

- name: Create container base directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ container_base_dir }}"
    - /etc/containers/systemd

- name: Configure container registries
  ansible.builtin.template:
    src: registries.conf.j2
    dest: /etc/containers/registries.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload podman registries

- name: Ensure podman socket is available (rootful)
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started

- name: Create podman shared network {{ podman_network_name }}
  containers.podman.podman_network:
    name: "{{ podman_network_name }}"
    state: present
    driver: bridge
    # Disable DNS by default; containers use container names or IPs
    # Traefik discovers containers via socket, not DNS
