---
# Common variables applied to all managed hosts
# Sensitive values (passwords, tokens) should be moved to vault.yml
# and encrypted with: ansible-vault encrypt inventory/group_vars/all/vault.yml

ansible_user: root

# Container runtime
container_base_dir: /opt/containers
podman_network_name: traefik_net

# Traefik global settings
traefik_version: "v3"
traefik_image: "docker.io/traefik:v3"
traefik_log_level: "INFO"
traefik_acme_email: "admin@example.com"
# Set to true to switch from Let's Encrypt staging to production
# WARNING: production has strict rate limits; test with staging first
traefik_acme_production: false

# Firewall
firewall_allowed_ports:
  - "22/tcp"
  - "80/tcp"
  - "443/tcp"
  - "2222/tcp"   # Forgejo SSH

# Container registry configuration
container_registries_search:
  - "docker.io"
  - "quay.io"
  - "ghcr.io"
  - "codeberg.org"

# System packages (Debian/Ubuntu base - override in host_vars for RPM systems)
common_packages:
  - podman
  - firewalld
  - python3-passlib
  - python3-bcrypt
  - curl
  - wget
  - git
  - htop
  - vim
  - ca-certificates
  - gnupg
  - lsb-release
