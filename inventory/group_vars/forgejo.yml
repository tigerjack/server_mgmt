---
# Variables for the 'forgejo' group

forgejo_image: "codeberg.org/forgejo/forgejo:latest"
forgejo_db_image: "docker.io/postgres:16-alpine"

forgejo_container_name: "forgejo"
forgejo_db_container_name: "forgejo_db"

# Directory layout on host
forgejo_base_dir: "{{ container_base_dir }}/forgejo"
forgejo_data_dir: "{{ forgejo_base_dir }}/data"
forgejo_db_dir: "{{ forgejo_base_dir }}/db"

# SSH port for git operations (exposed on host, avoid conflict with system SSH on 22)
forgejo_ssh_port: 2222

# Database configuration
forgejo_db_name: "forgejo"
forgejo_db_user: "forgejo"
# OVERRIDE THESE with ansible-vault in production!
forgejo_db_password: "changeme_forgejo_db_password"

# Forgejo domain (override per host)
forgejo_domain: "git.example.com"

# Forgejo app.ini overrides
forgejo_secret_key: "changeme_a_very_long_random_secret_key_replace_this"
forgejo_internal_token: "changeme_another_long_random_token_replace_this"
forgejo_jwt_secret: "changeme_jwt_secret_replace_this"

# Registration settings
forgejo_disable_registration: false
forgejo_require_signin_view: false
