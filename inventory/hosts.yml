---
# Ansible inventory - replace hostnames/IPs with your actual servers
# All servers must have root SSH access configured
#
# Usage with vault:
#   ansible-playbook playbooks/site.yml --vault-password-file .vault_pass

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  children:
    # Web servers hosting the static landing page
    web:
      hosts:
        web01:
          ansible_host: 192.168.1.10
          web_domain: "www.example.com"

    # Servers running Nextcloud
    nextcloud:
      hosts:
        app01:
          ansible_host: 192.168.1.11
          nextcloud_domain: "cloud.example.com"

    # Servers running Forgejo
    forgejo:
      hosts:
        app01:
          ansible_host: 192.168.1.11
          forgejo_domain: "git.example.com"

    # Group for servers that run both Nextcloud and Forgejo
    # (app01 belongs to both nextcloud and forgejo, this is explicit)
    app_servers:
      hosts:
        app01:
          ansible_host: 192.168.1.11

    # All managed servers - used for common role
    managed:
      children:
        web:
        nextcloud:
        forgejo:
