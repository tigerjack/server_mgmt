---
# Master playbook - deploys all services to all managed hosts
# Run: ansible-playbook playbooks/site.yml
# With vault: ansible-playbook playbooks/site.yml --vault-password-file .vault_pass

- name: Apply common baseline to all managed servers
  hosts: managed
  become: true
  roles:
    - role: common
      tags: [common, always]

- name: Deploy Traefik on all servers that need it
  hosts: web:nextcloud:forgejo
  become: true
  roles:
    - role: traefik
      tags: [traefik]

- name: Deploy static web server
  hosts: web
  become: true
  roles:
    - role: static_web
      tags: [web, static_web]

- name: Deploy Nextcloud
  hosts: nextcloud
  become: true
  roles:
    - role: nextcloud
      tags: [nextcloud]

- name: Deploy Forgejo
  hosts: forgejo
  become: true
  roles:
    - role: forgejo
      tags: [forgejo]
