---
# Nextcloud playbook - deploy/update Nextcloud servers only
# Run: ansible-playbook playbooks/nextcloud.yml
# With vault: ansible-playbook playbooks/nextcloud.yml --vault-password-file .vault_pass

- name: Apply common baseline to Nextcloud servers
  hosts: nextcloud
  become: true
  roles:
    - role: common
      tags: [common]

- name: Deploy Traefik on Nextcloud servers
  hosts: nextcloud
  become: true
  roles:
    - role: traefik
      tags: [traefik]

- name: Deploy Nextcloud
  hosts: nextcloud
  become: true
  roles:
    - role: nextcloud
      tags: [nextcloud]
